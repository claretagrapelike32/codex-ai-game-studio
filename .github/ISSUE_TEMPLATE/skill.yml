name: Skill or tutorial proposal
description: Suggest a Codex-native workflow, prompt tutorial, recipe, or quality gate.
title: "[Skill]: "
labels: [skill, enhancement, triage]
body:
  - type: input
    id: outcome
    attributes:
      label: User outcome
      placeholder: What should a game developer be able to accomplish?
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Realistic starter prompt
      description: Show what a user would say, including important constraints.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Inspection, questions, proposal, changes, artifacts, and rollback
      description: Describe each phase and identify where explicit confirmation is required.
    validations:
      required: true
  - type: textarea
    id: gates
    attributes:
      label: Rights, technical, visual, runtime, playability, and approval gates
    validations:
      required: true
