name: Bug report
description: Report a reproducible plugin, skill, validator, or workflow defect.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private project content, and identity references from this report.
          required: true
        - label: I searched existing issues and Discussions.
          required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Core plugin or skill
        - Automation pack or hooks
        - Unity pack
        - Godot pack
        - Unreal pack
        - Blender pack
        - Pixel pack
        - Catalog
        - Documentation or release tooling
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or full commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Codex surface, engine/DCC version, and relevant runtime versions. Do not include secret values.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the prompt or exact local command, read-only detector result, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Transaction and rollback evidence
      description: If a confirmed transaction was involved, include redacted plan/transaction IDs, digest prefix, backup status, and rollback outcome.
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or artifacts
      render: shell
