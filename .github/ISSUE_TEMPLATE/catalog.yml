name: Catalog correction
description: Propose a repository addition, metadata correction, license review, or archive update.
title: "[Catalog]: "
labels: [catalog, triage]
body:
  - type: input
    id: repository
    attributes:
      label: Canonical GitHub repository URL
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: input
    id: record
    attributes:
      label: Existing catalog ID
      description: Leave blank only for a proposed addition.
  - type: dropdown
    id: change
    attributes:
      label: Change type
      options:
        - Stable curation correction
        - License or commercial-use review
        - Security or permission correction
        - Platform or hardware correction
        - Archive or activity correction
        - Proposed repository addition
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Primary-source evidence
      description: Link to the upstream license, documentation, release, or pinned source lines. Stars alone are not acceptance evidence.
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Catalog policy
      options:
        - label: I understand that a catalog entry does not authorize installation, execution, commercial use, or model-weight use.
          required: true
