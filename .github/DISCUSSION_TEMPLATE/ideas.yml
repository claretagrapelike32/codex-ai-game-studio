title: "[Idea] "
labels: [discussion]
body:
  - type: markdown
    attributes:
      value: |
        Share a game-development workflow, prompt pattern, adapter, or quality-gate idea. Do not post credentials, private assets, or unlicensed identity/voice references.
  - type: textarea
    id: problem
    attributes:
      label: Problem and audience
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Include what a user would say and what Codex should inspect, ask, propose, change, produce, and roll back.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Compatibility, rights, cost, and safety tradeoffs
    validations:
      required: true
